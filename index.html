<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Quiz Broncodilatadores</title>

<style>
body { font-family: Arial; background:#eef2f7; text-align:center; }
.container { max-width:650px; margin:auto; background:white; padding:25px; border-radius:12px; box-shadow:0 0 10px rgba(0,0,0,0.1);}
input, button { padding:10px; margin:8px; }
button { cursor:pointer; border:none; border-radius:6px; background:#4CAF50; color:white; }
#skip { background:#f39c12; }
#next { background:#3498db; }
#timer { font-size:18px; font-weight:bold; }
</style>

</head>

<body>

<div class="container">

<button style="
position:fixed;
top:15px;
left:15px;
background:#1e293b;
color:white;
padding:10px;
border-radius:8px;
z-index:1000;
"
onclick="window.location.href='https://juanfelopsanchez.github.io/Plataforma-Farmaco-MVP/'">
⬅
</button>

<h2>🌬️ Quiz Broncodilatadores</h2>

<div id="start">
<input id="name" placeholder="Tu nombre">
<br>
<button id="startBtn">Iniciar Quiz</button>
</div>

<div id="quiz" style="display:none;">
<p id="progress"></p>
<p id="timer"></p>
<p id="question"></p>

<input id="answer" placeholder="Escribe tu respuesta">
<br>

<button id="submit">Responder</button>
<button id="skip">No estoy seguro</button>

<p id="feedback"></p>
<button id="next" style="display:none;">Siguiente</button>
</div>

<div id="result" style="display:none;"></div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

let questions = [

{q:"Receptor activado por beta2 agonistas para broncodilatación", a:["beta2","receptor beta2"]},

{q:"Segundo mensajero aumentado por beta2 agonistas", a:["camp"]},

{q:"Fármaco beta2 agonista de acción corta (SABA)", a:["salbutamol","albuterol"]},

{q:"Uso principal de salbutamol", a:["crisis de asma"]},

{q:"Fármaco beta2 agonista de acción prolongada (LABA)", a:["salmeterol","formoterol"]},

{q:"Uso clínico de LABA", a:["asma control","epoc"]},

{q:"Efecto adverso de beta2 agonistas", a:["taquicardia","temblor"]},

{q:"Mecanismo de beta2 agonistas en músculo liso", a:["relajacion"]},

{q:"Fármaco anticolinérgico usado en EPOC", a:["ipratropio"]},

{q:"Mecanismo de ipratropio", a:["bloquea muscarinicos"]},

{q:"Efecto de anticolinérgicos en bronquios", a:["broncodilatacion"]},

{q:"Fármaco anticolinérgico de acción larga", a:["tiotropio"]},

{q:"Uso principal de tiotropio", a:["epoc"]},

{q:"Metilxantina usada como broncodilatador", a:["teofilina"]},

{q:"Mecanismo de teofilina", a:["inhibe fosfodiesterasa"]},

{q:"Efecto de inhibir fosfodiesterasa", a:["aumenta camp"]},

{q:"Efecto adverso grave de teofilina", a:["arritmias","convulsiones"]},

{q:"Caso: paciente con asma aguda, fármaco inicial", a:["salbutamol"]},

{q:"Caso: paciente con EPOC crónico, fármaco mantenimiento", a:["tiotropio"]},

{q:"Fármaco que reduce broncoconstricción mediada por acetilcolina", a:["ipratropio"]},

{q:"Efecto de beta2 agonistas sobre músculo bronquial", a:["relaja"]},

{q:"Fármaco que aumenta AMPc produciendo broncodilatación", a:["salbutamol","teofilina"]},

{q:"Caso: paciente con temblor tras inhalador, causa", a:["beta2 agonistas"]},

{q:"Diferencia clave entre SABA y LABA", a:["duracion"]},

{q:"Fármaco que no debe usarse solo en asma (LABA)", a:["salmeterol"]},

{q:"Efecto adverso cardiovascular de beta2 agonistas", a:["taquicardia"]},

{q:"Fármaco que bloquea receptores M3 bronquiales", a:["ipratropio","tiotropio"]},

{q:"Caso: broncoespasmo por ACh, tratamiento", a:["anticolinergicos"]},

{q:"Fármaco que relaja músculo bronquial aumentando cAMP", a:["salbutamol"]},

{q:"Uso clínico principal de broncodilatadores", a:["asma","epoc"]},

{q:"Fármaco que puede causar nerviosismo e insomnio", a:["teofilina"]},

{q:"Caso: paciente con EPOC + secreciones, fármaco útil", a:["ipratropio"]}

];

let selected = [];
let index = 0;
let score = 0;
let timer;
let timeLeft = 60;
let answered = false;

function normalize(text){
return text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

function startQuiz(){
let name = document.getElementById("name").value;
if(!name) return alert("Ingresa tu nombre");

localStorage.setItem("name", name);

selected = questions.sort(()=>0.5-Math.random()).slice(0,10);
index = 0;
score = 0;

document.getElementById("start").style.display="none";
document.getElementById("quiz").style.display="block";

loadQuestion();
}

function loadQuestion(){
answered = false;
timeLeft = 60;

document.getElementById("answer").value="";
document.getElementById("answer").disabled=false;
document.getElementById("feedback").innerHTML="";
document.getElementById("next").style.display="none";

document.getElementById("progress").innerText=`Pregunta ${index+1}/10`;
document.getElementById("question").innerText=selected[index].q;

startTimer();
}

function startTimer(){
clearInterval(timer);
timer = setInterval(()=>{
timeLeft--;
document.getElementById("timer").innerText=`⏱️ ${timeLeft}s`;

if(timeLeft<=0){
clearInterval(timer);
handleAnswer(null,true);
}
},1000);
}

function handleAnswer(userAnswer, timeout=false){
if(answered) return;
answered = true;
clearInterval(timer);

document.getElementById("answer").disabled = true;

let correctAnswers = selected[index].a.map(a=>normalize(a));
let user = normalize(userAnswer || "");

let isCorrect = correctAnswers.includes(user);

let points = isCorrect ? Math.round((timeLeft/60)*10) : 0;
score += points;

let feedback = "";

if(timeout){
feedback = `❌ Tiempo agotado (0 pts)<br>Respuesta: ${correctAnswers[0]}`;
}else if(userAnswer===null){
feedback = `❌ 0 pts<br>Respuesta: ${correctAnswers[0]}`;
}else if(isCorrect){
feedback = `✅ Correcto (+${points})`;
}else{
feedback = `❌ Incorrecto (0 pts)<br>Respuesta: ${correctAnswers[0]}`;
}

document.getElementById("feedback").innerHTML=feedback;
document.getElementById("next").style.display="block";
}

function nextQuestion(){
index++;
if(index<10){
loadQuestion();
}else{
endQuiz();
}
}

function endQuiz(){
document.getElementById("quiz").style.display="none";
document.getElementById("result").style.display="block";

let name = localStorage.getItem("name");
let record = {name, score, date:new Date().toISOString(), tema:"broncodilatadores"};

let history = JSON.parse(localStorage.getItem("history")||"[]");
history.push(record);
localStorage.setItem("history", JSON.stringify(history));

document.getElementById("result").innerHTML = `
<h3>🎯 Puntaje: ${score}/100</h3>
<button onclick="location.reload()">Reintentar</button>
`;
}

document.getElementById("startBtn").addEventListener("click", startQuiz);
document.getElementById("submit").addEventListener("click", ()=>handleAnswer(document.getElementById("answer").value));
document.getElementById("skip").addEventListener("click", ()=>handleAnswer(null));
document.getElementById("next").addEventListener("click", nextQuestion);

});
</script>

</body>
</html>
